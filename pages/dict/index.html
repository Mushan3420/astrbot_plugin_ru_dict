<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>俄语词库</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2329;
        --sub: #646a73;
        --line: #e5e6eb;
        --brand: #b5121b;
        --ok: #1a7f37;
        --err: #cf222e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181b;
          --fg: #e8e8ea;
          --sub: #9aa0a6;
          --line: #2c2f33;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .wrap { max-width: 720px; margin: 0 auto; }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1::before {
        content: "";
        width: 4px;
        height: 18px;
        border-radius: 2px;
        background: var(--brand);
      }
      .hint { color: var(--sub); margin: 0 0 20px; font-size: 13px; }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 4px 16px;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child { border-bottom: none; }
      .k { width: 72px; flex: none; color: var(--sub); }
      .v { flex: 1; word-break: break-all; }
      .v.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
      .ok { color: var(--ok); }
      .err { color: var(--err); }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        font-size: 14px;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .actions { display: flex; gap: 10px; align-items: center; }
      button.ghost {
        background: transparent;
        color: var(--sub);
        border: 1px solid var(--line);
      }
      button.ghost:hover { color: var(--err); border-color: var(--err); }
      .hidden { display: none; }
      .barWrap {
        margin-top: 14px;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .barWrap.hidden { display: none; }
      #bar {
        height: 100%;
        width: 0;
        background: var(--brand);
        transition: width 0.3s ease;
      }
      #msg { margin-top: 10px; font-size: 13px; color: var(--sub); min-height: 20px; }
      #trace { font-size: 12px; color: var(--sub); line-height: 1.6; word-break: break-all; }
      .mirrorBox { border-top: 1px solid var(--line); padding: 12px 0 4px; }
      .mirrorRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .mirrorRow .k { width: 72px; flex: none; color: var(--sub); }
      select, input[type="text"] {
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
      }
      select { min-width: 210px; }
      input[type="text"] { flex: 1; min-width: 200px; }
      button.ghost:not(:hover) { color: var(--fg); }
      button.small { padding: 7px 14px; font-size: 13px; }
      .mirrorHint { margin: 8px 0 0; font-size: 12.5px; line-height: 1.7; color: var(--sub); }
      .mirrorHint.warn { color: var(--err); }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        background: rgba(127, 127, 127, 0.12);
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>俄语词库</h1>
      <p class="hint">
        插件不含词库，点下面的按钮从 GitHub Release 下载并解压到插件配置的路径，下次重载插件即可直接查词。
      </p>

      <div class="card">
        <div class="row"><span class="k">状态</span><span class="v" id="state">读取中…</span></div>
        <div class="row"><span class="k">路径</span><span class="v mono" id="path">—</span></div>
        <div class="row"><span class="k">大小</span><span class="v" id="size">—</span></div>
        <div class="row"><span class="k">词条</span><span class="v" id="entries">—</span></div>
        <div class="row">
          <span class="k">词库版本</span>
          <span class="v" id="version">—</span>
          <button id="check" class="ghost small">检查更新</button>
        </div>
        <div class="row"><span class="k">最新版本</span><span class="v" id="latest">—</span></div>
        <div class="row"><span class="k">词库来源</span><span class="v mono" id="url">—</span></div>
        <div class="row"><span class="k">加速线路</span><span class="v" id="route">—</span></div>
        <div class="mirrorBox">
          <div class="mirrorRow">
            <span class="k">镜像设置</span>
            <select id="mirrorSel"></select>
            <input type="text" id="mirrorCustom" class="hidden" placeholder="https://gh-proxy.com 或 https://你的域名/{url}" />
            <button id="mirrorSave" class="ghost small">保存</button>
          </div>
          <div class="mirrorHint" id="mirrorHint"></div>
        </div>
      </div>

      <div class="actions">
        <button id="btn">下载词库</button>
        <button id="pause" class="ghost hidden">暂停</button>
        <button id="cancel" class="ghost hidden">取消下载</button>
      </div>

      <div class="barWrap hidden" id="barWrap"><div id="bar"></div></div>
      <div id="msg"></div>
      <div id="trace"></div>
    </div>

    <script type="module">
      const bridge = window.AstrBotPluginPage;
      const $ = (id) => document.getElementById(id);
      const btn = $("btn");
      let timer = null;
      let state = {};
      const pauseBtn = $("pause");
      const cancelBtn = $("cancel");

      // 按当前状态摆按钮：进行中→暂停/取消；暂停或失败但留有半截包→继续/取消；其它→下载。
      function syncButtons() {
        const d = state.download || {};
        const partial = state.partial || {};
        const running = d.state === "running";
        const resumable = !running && (d.state === "paused" || partial.exists);
        btn.disabled = running;
        const installed = !!(state.db && state.db.exists);
        btn.textContent = running
          ? "下载中…"
          : resumable
            ? "继续下载"
            : installed
              ? "更新词库"
              : "下载词库";
        pauseBtn.classList.toggle("hidden", !running);
        cancelBtn.classList.toggle("hidden", !(running || resumable));
      }

      // AstrBot 的预设镜像，顺序与 ProxySelector 里的 githubProxies 一致
      const ASTRBOT_PRESETS = [
        "https://gh.dpik.top",
        "https://gh-proxy.com",
        "https://hk.gh-proxy.com",
        "https://edgeone.gh-proxy.com",
      ];
      const MIRROR_OPTIONS = [
        ["", "不使用镜像（直连 GitHub）"],
        ["https://gh-proxy.com", "https://gh-proxy.com"],
        ["https://gh.dpik.top", "https://gh.dpik.top"],
        ["https://edgeone.gh-proxy.com", "https://edgeone.gh-proxy.com"],
        ["https://hk.gh-proxy.com", "https://hk.gh-proxy.com"],
        ["__custom__", "自定义地址…"],
      ];
      const proxyProbe = { value: "", blocked: false, reason: "" };

      // 读 AstrBot「设置 → 网络 → GitHub 加速地址」。
      // 该设置只存在 WebUI 的 localStorage；但 AstrBot 把插件页放进
      // sandbox="allow-scripts allow-forms allow-downloads" 的 iframe（没有
      // allow-same-origin），页面处于不透明源，访问 localStorage 会抛
      // SecurityError，所以这条继承路径常常读不到，需要页面内自己设置。
      function astrbotProxy() {
        proxyProbe.value = "";
        proxyProbe.blocked = false;
        try {
          const radio = String(localStorage.getItem("githubProxyRadioValue") || "0");
          const control = String(localStorage.getItem("githubProxyRadioControl") || "0");
          const saved = (localStorage.getItem("selectedGitHubProxy") || "").trim();
          const custom = (localStorage.getItem("selectedGitHubProxyCustom") || "").trim();
          let value = "";
          if (radio === "1") {
            if (control === "-1") value = saved || custom;
            else if (/^\d+$/.test(control)) value = ASTRBOT_PRESETS[Number(control)] || saved;
            else value = saved;
          }
          proxyProbe.value = value;
        } catch (e) {
          proxyProbe.blocked = true;
          proxyProbe.reason = (e && e.name) || String(e);
          proxyProbe.value = "";
        }
        return proxyProbe.value;
      }

      function renderMirrorPicker() {
        const sel = $("mirrorSel");
        const custom = $("mirrorCustom");
        const saved = (state.mirror || "").trim();
        const known = MIRROR_OPTIONS.some(([v]) => v === saved && v !== "");
        sel.innerHTML = MIRROR_OPTIONS.map(
          ([v, label]) => `<option value="${v}">${label}</option>`
        ).join("");
        sel.value = saved && !known ? "__custom__" : saved;
        custom.classList.toggle("hidden", sel.value !== "__custom__");
        custom.value = saved && !known ? saved : "";
      }

      function renderRoute() {
        const pluginMirror = (state.mirror || "").trim();
        const proxy = astrbotProxy();
        const route = $("route");
        const hint = $("mirrorHint");
        hint.className = "mirrorHint";
        if (pluginMirror) {
          route.textContent = `使用已保存的镜像：${pluginMirror}`;
          hint.textContent =
            "这条线路存在插件配置 db_mirror 里，重启插件仍然有效；想改就改上面的选择，或到「插件 → 俄语查词助手 → 配置」里编辑 db_mirror。";
        } else if (proxyProbe.blocked) {
          route.textContent = "直连 GitHub（读不到 AstrBot 的加速设置）";
          hint.className = "mirrorHint warn";
          hint.textContent =
            "AstrBot 的「设置 → 网络 → GitHub 加速地址」只存在浏览器 localStorage 里，而 AstrBot 把插件页面放在沙箱 iframe 中（没有 allow-same-origin），页面读不到它。请在上面选一条镜像点保存，或到「插件 → 俄语查词助手 → 配置 → 加速地址 db_mirror」里填写。";
        } else if (!proxy) {
          route.textContent = "直连 GitHub（AstrBot 未启用加速地址）";
          hint.textContent =
            "没有检测到加速地址。可以在上面选一条镜像点保存；或者去 AstrBot「设置 → 网络 → GitHub 加速地址」选好后回到本页点保存以固定下来。";
        } else {
          route.textContent = `跟随 AstrBot 设置：${proxy}`;
          hint.textContent =
            "已继承 AstrBot 的加速地址。想固定成插件自己的设置，可在上面选同一条线路点保存。";
        }
      }

      function fmtSize(n) {
        if (!n) return "—";
        const u = ["B", "KB", "MB", "GB"];
        let i = 0;
        let v = n;
        while (v >= 1024 && i < u.length - 1) {
          v /= 1024;
          i += 1;
        }
        return `${v.toFixed(i ? 1 : 0)} ${u[i]}`;
      }

      function renderStatus(data) {
        const db = data.db || {};
        $("path").textContent = db.path || "—";
        if (db.exists) {
          $("state").textContent = db.loaded ? "已就绪" : "文件在，但未加载（重载插件生效）";
          $("state").className = "v ok";
        } else {
          $("state").textContent = "未安装";
          $("state").className = "v err";
        }
        $("size").textContent = db.exists ? `${fmtSize(db.size)}${db.mtime ? " · " + db.mtime : ""}` : "—";
        $("entries").textContent = db.exists && db.entries ? db.entries.toLocaleString() + " 条" : "—";
        $("url").textContent = data.url || "未配置下载地址";
        const ver = data.version || {};
        $("version").textContent = db.exists
          ? `${ver.version || "未知（升级前的旧库）"}${ver.installed_at ? " · 装于 " + ver.installed_at : ""}`
          : "—";
        const latest = data.latest;
        $("latest").textContent = latest && latest.version
          ? `${latest.version}${latest.built_at ? " · " + latest.built_at : ""}`
          : "—";
        markUpdate(latest && latest.version, ver.version);
      }

      // 本机版本与远端版本不一致时，把「最新版本」标绿并提示可更新
      function markUpdate(latest, current) {
        const el = $("latest");
        if (!latest) {
          el.className = "v";
          return;
        }
        const fresh = !current || latest.localeCompare(current, undefined, { numeric: true }) > 0;
        el.className = fresh ? "v ok" : "v";
      }

      function renderProgress(d) {
        if (!d || d.state === "idle") return;
        const wrap = $("barWrap");
        wrap.classList.remove("hidden");
        if (d.total) {
          $("bar").style.width = `${Math.min(100, (d.bytes / d.total) * 100)}%`;
        } else if (d.state === "running") {
          $("bar").style.width = "30%";
        } else if (d.state === "done") {
          $("bar").style.width = "100%";
        }
        const extra =
          d.state === "running" && d.speed
            ? ` · ${fmtSize(d.speed)}/s · 共 ${fmtSize(d.total)}`
            : "";
        $("msg").textContent = d.message ? d.message + extra : "";
        $("msg").className = d.state === "error" ? "err" : "";
        const trace = Array.isArray(d.trace) ? d.trace : [];
        $("trace").textContent = trace.length ? "线路记录：" + trace.join(" → ") : "";
      }

      async function refresh() {
        try {
          const res = await bridge.apiGet("status");
          state = res || {};
          renderStatus(state);
          renderMirrorPicker();
          renderRoute();
          if (res.download && res.download.state !== "idle") {
            renderProgress(res.download);
            if (res.download.state === "running") startPolling();
          }
          syncButtons();
        } catch (e) {
          $("state").textContent = "读取失败：" + e;
          $("state").className = "v err";
        }
      }

      function startPolling() {
        if (timer) return;
        timer = setInterval(async () => {
          try {
            const res = await bridge.apiGet("progress");
            state.download = res.download || {};
            renderProgress(res.download);
            syncButtons();
            if (res.download.state !== "running") {
              clearInterval(timer);
              timer = null;
              refresh();
            }
          } catch (e) {
            clearInterval(timer);
            timer = null;
            $("msg").textContent = "进度查询失败：" + e;
          }
        }, 1000);
      }

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "下载中…";
        $("msg").textContent = "";
        try {
          const res = await bridge.apiPost("download", { proxy: astrbotProxy() });
          if (!res.ok) {
            $("msg").textContent = res.message || "下载未能启动";
            $("msg").className = "err";
            syncButtons();
            return;
          }
          state.download = { state: "running" };
          syncButtons();
          startPolling();
        } catch (e) {
          $("msg").textContent = "请求失败：" + e;
          $("msg").className = "err";
          syncButtons();
        }
      });

      $("mirrorSel").addEventListener("change", () => {
        $("mirrorCustom").classList.toggle("hidden", $("mirrorSel").value !== "__custom__");
      });

      $("mirrorSave").addEventListener("click", async () => {
        const sel = $("mirrorSel");
        const value = sel.value === "__custom__" ? $("mirrorCustom").value.trim() : sel.value;
        const btn2 = $("mirrorSave");
        btn2.disabled = true;
        try {
          const res = await bridge.apiPost("mirror", { mirror: value });
          if (res.ok) {
            state.mirror = res.mirror || value;
            renderMirrorPicker();
            renderRoute();
          }
          $("msg").textContent = res.message || (res.ok ? "已保存" : "保存失败");
          $("msg").className = res.ok ? "" : "err";
        } catch (e) {
          $("msg").textContent = "保存失败：" + e;
          $("msg").className = "err";
        } finally {
          btn2.disabled = false;
        }
      });

      // 检查远端版本。silent=true 时用于页面加载后的自动探测，不打断用户、不弹错。
      async function runCheck(opts) {
        const silent = !!(opts && opts.silent);
        const b = $("check");
        if (!silent) {
          b.disabled = true;
          $("latest").textContent = "检查中…";
        }
        try {
          const res = await bridge.apiGet("check");
          if (res.ok && res.manifest) {
            state.latest = {
              version: res.latest,
              built_at: res.manifest.built_at || "",
            };
            // 先把状态重新读一遍：后端可能刚按指纹补写了版本记录，
            // 不重绘的话「词库版本」行会一直停在「未知」
            await refresh();
            markUpdate(res.latest, (state.version || {}).version || res.current);
            $("msg").textContent = res.update_available
              ? `有新版本 ${res.latest}（本机 ${res.current || "未知"}），点「更新词库」即可`
              : res.message;
            $("msg").className = res.update_available ? "err" : "";
          } else if (!silent) {
            $("latest").textContent = "—";
            $("msg").textContent = res.message || "检查失败";
            $("msg").className = "err";
          }
        } catch (e) {
          if (!silent) {
            $("msg").textContent = "检查失败：" + e;
            $("msg").className = "err";
          }
        } finally {
          if (!silent) b.disabled = false;
        }
      }

      $("check").addEventListener("click", () => runCheck());

      pauseBtn.addEventListener("click", async () => {
        pauseBtn.disabled = true;
        try {
          const res = await bridge.apiPost("pause", {});
          $("msg").textContent = res.ok ? "已暂停" : res.message || "暂停失败";
          $("msg").className = res.ok ? "" : "err";
          if (res.ok) {
            if (timer) {
              clearInterval(timer);
              timer = null;
            }
            refresh();
          }
        } catch (e) {
          $("msg").textContent = "暂停请求失败：" + e;
          $("msg").className = "err";
        } finally {
          pauseBtn.disabled = false;
        }
      });

      cancelBtn.addEventListener("click", async () => {
        cancelBtn.disabled = true;
        try {
          const res = await bridge.apiPost("cancel", {});
          $("msg").textContent = res.ok ? "已取消" : res.message || "取消失败";
          $("msg").className = res.ok ? "" : "err";
          if (res.ok) {
            if (timer) {
              clearInterval(timer);
              timer = null;
            }
            refresh();
          }
        } catch (e) {
          $("msg").textContent = "取消请求失败：" + e;
          $("msg").className = "err";
        } finally {
          cancelBtn.disabled = false;
        }
      });

      await bridge.ready();
      await refresh();
      // 词库已装但没有版本记录（升级前的老库）→ 自动查一次：
      // 远端内容一致就直接补记版本号，不需要为了看版本再下一次 60 MB
      if (state.db && state.db.exists && !((state.version || {}).version)) {
        runCheck({ silent: true });
      }
    </script>
  </body>
</html>
