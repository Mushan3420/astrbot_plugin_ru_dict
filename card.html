<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720px;
    padding: 24px 28px 28px;
    background: #f7f6f3;
    font-family: "Noto Sans", "DejaVu Sans", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f1d1a;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 26px 28px;
    border-top: 5px solid #b5121b;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .lemma {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: .3px;
    margin-bottom: 14px;
    word-break: break-word;
  }
  .body {
    font-size: 21px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .foot {
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px dashed #d8d4cc;
    font-size: 14px;
    color: #8a857c;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lemma">{{ lemma }}</div>
    <div class="body">{{ text }}</div>
    <div class="foot">词库：Wiktionary / Kaikki（CC BY-SA 4.0）</div>
  </div>
</body>
</html>
